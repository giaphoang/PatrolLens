services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: patrol_lens
      POSTGRES_USER: patrol_lens
      POSTGRES_PASSWORD: patrol_lens
    ports:
      - "5435:5432"
    volumes:
      - patrol_lens_pgdata:/var/lib/postgresql/data

volumes:
  patrol_lens_pgdata:
