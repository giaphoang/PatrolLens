[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patrol-lens"
version = "0.1.0"
description = "Modality-aware natural-language search for body-worn camera footage"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
media = [
  "numpy>=1.26",
  "pillow>=10",
  "torch>=2.2",
  "transformers>=4.45",
  "faster-whisper>=1.0",
]
dev = ["pytest>=8"]

[project.scripts]
patrol-lens = "patrol_lens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
