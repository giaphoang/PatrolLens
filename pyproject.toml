[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patrol-lens"
version = "0.2.0"
description = "Retrieval-guided Gemini active perception for body-worn camera search"
requires-python = ">=3.11"
dependencies = ["pillow>=10", "python-dotenv>=1.0"]

[project.optional-dependencies]
openrouter = ["openai>=1.0"]
# Compatibility alias: the reasoning model remains Gemini, while transport is OpenRouter.
gemini = ["openai>=1.0"]
postgres = ["psycopg[binary]>=3.2", "pgvector>=0.3"]
vision = [
  "numpy>=1.26",
  "pillow>=10",
  "torch>=2.2",
  "transformers>=4.45",
  "faiss-cpu>=1.8",
]
speech = [
  "faster-whisper>=1.0",
]
audio = ["silero-vad>=5"]
clap-macos = [
  "coremltools>=8,<10",
  "huggingface-hub>=0.27",
  "numpy>=1.26",
  "onnxruntime>=1.20",
  "transformers>=4.45",
]
full = [
  "openai>=1.0",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "numpy>=1.26",
  "pillow>=10",
  "torch>=2.2",
  "silero-vad>=5",
  "coremltools>=8,<10; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "huggingface-hub>=0.27; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "onnxruntime>=1.20; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "transformers>=4.45; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
dev = ["pytest>=8"]

[project.scripts]
patrol-lens = "patrol_lens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
