<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{ page.title | default: site.title }}</title>

    <!-- MathJax (TeX + MathML + HTML-CSS) -->
    <script id="MathJax-script" async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
    </script>

    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial; max-width: 900px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }
      pre { background:#f6f8fa; padding:1rem; overflow:auto; }
      code { background:#f6f8fa; padding:.1rem .3rem; border-radius:3px; }
    </style>
  </head>
  <body>
    <article>
      <h1>{{ page.title }}</h1>
      <main>
        {{ content }}
      </main>
    </article>
  </body>
</html>
